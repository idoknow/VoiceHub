name: Deploy Production (K3s)

# 推送到 deploy/prod 时构建镜像并部署到 k3s：main 为开发分支，deploy/prod 为发布分支。
# 构建失败不影响生产；部署失败保留上一版本 Pod。

on:
  push:
    branches:
      - deploy/prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: voicehub-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: idoknow/voicehub

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=voicehub
          cache-to: type=gha,mode=max,scope=voicehub
          provenance: false
          sbom: false

  deploy:
    name: Deploy Production (K3s)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/deploy/prod'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit is on main
        run: |
          git fetch origin main deploy/prod
          test "$(git rev-parse origin/deploy/prod)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.4

      - name: Deploy exact image and verify production
        env:
          KUBECONFIG_DATA: ${{ secrets.VOICEHUB_KUBECONFIG }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          IMAGE_PULL_HOST: ghcr.nju.edu.cn
        run: bash scripts/deploy-k3s.sh
